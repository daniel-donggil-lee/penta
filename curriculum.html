<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>펜타스쿨 커리큘럼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1f2328; --muted: #656d76; --line: #d1d9e0; --line-soft: #eaeef2;
    --bg: #f6f8fa; --card: #ffffff; --blue: #0969da; --blue-soft: #ddf4ff;
    --violet: #8250df; --violet-soft: #fbefff; --green: #1a7f37; --danger: #cf222e; --radius: 8px;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  .topbar {
    position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(8px); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
  }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .back:hover { color: var(--blue); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .brand .sub { font-size: 12px; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .whoami { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .whoami select {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; background: #fff; cursor: pointer;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 80px; }
  .intro { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .intro b { color: var(--ink); font-weight: 600; }
  .inst-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .inst-tab {
    display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); background: #fff;
    border-radius: var(--radius); padding: 10px 16px; cursor: pointer; min-width: 150px; transition: all .12s;
  }
  .inst-tab:hover { border-color: var(--muted); }
  .inst-tab .n { font-size: 14px; font-weight: 700; }
  .inst-tab .r { font-size: 12px; color: var(--muted); }
  .inst-tab .c { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .inst-tab.active { border-width: 2px; padding: 9px 15px; }
  .inst-tab.active[data-color="blue"] { border-color: var(--blue); background: var(--blue-soft); }
  .inst-tab.active[data-color="violet"] { border-color: var(--violet); background: var(--violet-soft); }
  .inst-tab .me-badge { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--green); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
  .course-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .course-chip {
    border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 6px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink); transition: all .12s;
  }
  .course-chip:hover { border-color: var(--muted); }
  .course-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .course-add {
    border: 1px dashed var(--line); background: #fff; border-radius: 20px; padding: 6px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .course-add:hover { border-color: var(--blue); color: var(--blue); }
  .editor { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .editor-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 18px;
    border-bottom: 1px solid var(--line-soft); background: #fbfcfd;
  }
  .editor-head .ctitle { font-size: 16px; font-weight: 700; }
  .editor-head .cmeta { font-size: 12px; color: var(--muted); }
  .editor-head .spacer { flex: 1; }
  .mini-btn {
    font-family: inherit; font-size: 12px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  .mini-btn:hover { border-color: var(--muted); color: var(--ink); }
  .mini-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .ro-banner {
    display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: #fff8e6;
    border-bottom: 1px solid #f2e3b8; font-size: 12.5px; color: #7a5c00;
  }
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px;
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fbfcfd;
  }
  table.grid td { border-bottom: 1px solid var(--line-soft); padding: 0; vertical-align: top; }
  table.grid tr:last-child td { border-bottom: none; }
  .wk-cell { padding: 12px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  table.grid tr:nth-child(even) .wk-cell { background: #fafbfc; }
  .cell-in {
    width: 100%; border: none; background: transparent; resize: vertical; font-family: inherit;
    font-size: 13.5px; color: var(--ink); line-height: 1.55; padding: 12px; min-height: 46px; outline: none;
  }
  .cell-in:focus { background: var(--blue-soft); }
  .cell-in:disabled, .cell-in[readonly] { color: var(--ink); resize: none; }
  .cell-in::placeholder { color: #b8c0c9; }
  table.grid tr:nth-child(even) td.field-td { background: #fafbfc; }
  table.grid tr:nth-child(even) .cell-in:focus { background: var(--blue-soft); }
  col.c-wk { width: 62px; } col.c-topic { width: 20%; } col.c-goal { width: 26%; } col.c-act { width: 28%; } col.c-task { width: 20%; }
  .savebar {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-top: 1px solid var(--line-soft); background: #fbfcfd;
  }
  .btn-save {
    font-family: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--green);
    border: none; border-radius: 6px; padding: 8px 20px; cursor: pointer;
  }
  .btn-save:hover { background: #166a2e; }
  .btn-save:disabled { background: #94d3a2; cursor: not-allowed; }
  .save-status { font-size: 12.5px; color: var(--muted); }
  .save-status.dirty { color: var(--danger); font-weight: 600; }
  .save-status.ok { color: var(--green); font-weight: 600; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--line); border-radius: 12px; background: #fff;
  }
  .empty .big { font-size: 15px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 500; padding: 10px 20px;
    border-radius: 8px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 200;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(27,31,35,.4); display: none;
    align-items: center; justify-content: center; z-index: 300;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 28px; width: 340px; max-width: 90vw; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .modal h2 { font-size: 17px; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal .who-btn {
    display: block; width: 100%; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 13px; margin-bottom: 10px; cursor: pointer;
  }
  .modal .who-btn:hover { border-color: var(--blue); background: var(--blue-soft); }
  .modal .who-btn small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  @media (max-width: 720px) {
    .brand .sub { display: none; }
    table.grid col.c-wk { width: 44px; }
    .wk-cell { padding: 8px 4px; font-size: 12px; }
    .cell-in { font-size: 13px; padding: 9px; }
    table.grid, table.grid tbody, table.grid tr { display: block; }
    table.grid thead { display: none; }
    table.grid tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
    table.grid td { display: block; border: none; }
    .wk-cell { text-align: left; background: transparent !important; padding: 8px 12px 2px; }
    .field-td::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 6px 12px 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 보드</a>
  <div class="brand">
    <h1>펜타스쿨 커리큘럼</h1>
    <span class="sub">수업 커리큘럼을 한곳에 · 센터장 이동길</span>
  </div>
  <div class="spacer"></div>
  <div class="whoami">나: <select id="meSelect" onchange="setMe(this.value)"></select></div>
</div>

<div class="wrap">
  <p class="intro">강사별로 <b>강좌</b>를 개설하고 <b>8주 커리큘럼</b>을 입력합니다. 본인 강좌는 편집, 다른 강사 강좌는 열람할 수 있어요. <b>센터장(이동길)</b>은 전체 편집이 가능합니다.</p>
  <div class="inst-tabs" id="instTabs"></div>
  <div class="course-bar" id="courseBar"></div>
  <div id="stage"></div>
</div>

<div id="toast"></div>

<div class="modal-bg" id="whoModal">
  <div class="modal">
    <h2>누구세요?</h2>
    <p>내 강좌를 편집하려면 이름을 선택하세요.<br>(언제든 상단에서 바꿀 수 있어요)</p>
    <div id="whoBtns"></div>
  </div>
</div>

<script>
// 보드와 동일한 GAS 백엔드(trip2daniel @18) 사용
const API = 'https://script.google.com/macros/s/AKfycbxN3NaaZpCPPZfH7gEJVOGnyzJp9kvH5KtTXBMh86gnp6OCxcFPN8dGaK7THmVQb9vJoQ/exec';
const SHEET = '펜타스쿨_커리큘럼';
const WEEKS = 8;
const INSTRUCTORS = [
  { name: '이은경', role: '글쓰기', color: 'blue' },
  { name: '김문영', role: '인문독서', color: 'violet' },
];
const IDENTITIES = ['이은경', '김문영', '이동길'];
const FIELDS = [
  { key: 'topic',    label: '주제',     ph: '이번 주 다룰 주제·소재' },
  { key: 'goal',     label: '학습목표', ph: '학생이 도달할 목표' },
  { key: 'activity', label: '핵심활동', ph: '수업 중 핵심 활동·과업' },
  { key: 'task',     label: '과제',     ph: '집에서 할 과제·작문' },
];

let data = { '이은경': [], '김문영': [] };
let me = localStorage.getItem('penta_curri_me') || '';
let activeInst = INSTRUCTORS[0].name;
let activeCourse = null;
let dirty = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function blankWeeks() { return Array.from({ length: WEEKS }, () => ({ topic:'', goal:'', activity:'', task:'' })); }

async function load() {
  try {
    const res = await fetch(API + '?_=' + Date.now(), { cache: 'no-store' });
    const all = await res.json();
    parseRows(all[SHEET] || []);
  } catch (e) { console.error(e); toast('데이터를 불러오지 못했습니다'); }
  ensureActiveCourse();
  renderAll();
}

function parseRows(rows) {
  data = { '이은경': [], '김문영': [] };
  const idx = {};
  rows.forEach((r, i) => {
    if (i === 0 && String(r[0]).trim() === '강사') return;
    const inst = String(r[0] || '').trim();
    const course = String(r[1] || '').trim();
    if (!inst || !course) return;
    if (!data[inst]) data[inst] = [];
    const wkNum = parseInt(String(r[2] || '').replace(/[^0-9]/g, ''), 10) || 0;
    const key = inst + '|' + course;
    if (!idx[key]) { idx[key] = { course, weeks: blankWeeks() }; data[inst].push(idx[key]); }
    if (wkNum >= 1 && wkNum <= WEEKS) {
      idx[key].weeks[wkNum - 1] = {
        topic: String(r[3] || ''), goal: String(r[4] || ''),
        activity: String(r[5] || ''), task: String(r[6] || ''),
      };
    }
  });
}

function ensureActiveCourse() {
  const list = data[activeInst] || [];
  if (!list.find(c => c.course === activeCourse)) activeCourse = list.length ? list[0].course : null;
}
function canEdit(inst) { return me === inst || me === '이동길'; }
function courseObj() { return (data[activeInst] || []).find(c => c.course === activeCourse) || null; }

function renderAll() { renderMeSelect(); renderInstTabs(); renderCourseBar(); renderStage(); }
function renderMeSelect() {
  $('meSelect').innerHTML = IDENTITIES.map(n => `<option value="${n}" ${n===me?'selected':''}>${n}${n==='이동길'?' (센터장)':''}</option>`).join('');
}
function renderInstTabs() {
  $('instTabs').innerHTML = INSTRUCTORS.map(ins => {
    const n = (data[ins.name] || []).length;
    const isMe = me === ins.name;
    return `<div class="inst-tab ${ins.name===activeInst?'active':''}" data-color="${ins.color}" onclick="switchInst('${ins.name}')">
      <span class="n">${ins.name}${isMe?'<span class="me-badge">나</span>':''}</span>
      <span class="r">${ins.role}</span><span class="c">강좌 ${n}개</span></div>`;
  }).join('');
}
function renderCourseBar() {
  const list = data[activeInst] || [];
  let html = list.map(c => `<button class="course-chip ${c.course===activeCourse?'active':''}" onclick="switchCourse('${esc(c.course)}')">${esc(c.course)}</button>`).join('');
  if (canEdit(activeInst)) html += `<button class="course-add" onclick="newCourse()">＋ 새 강좌</button>`;
  $('courseBar').innerHTML = html;
}
function renderStage() {
  const editable = canEdit(activeInst);
  const insInfo = INSTRUCTORS.find(i => i.name === activeInst);
  if (!activeCourse || !courseObj()) {
    $('stage').innerHTML = `<div class="empty"><div class="big">${esc(activeInst)} · ${esc(insInfo.role)}</div>
      아직 개설한 강좌가 없습니다.${editable ? ' 위 <b>＋ 새 강좌</b>로 시작하세요.' : ' 강좌가 개설되면 여기에 표시됩니다.'}</div>`;
    return;
  }
  const c = courseObj();
  const roBanner = editable ? '' : `<div class="ro-banner">🔒 읽기 전용 — <b>&nbsp;${esc(activeInst)}</b>&nbsp; 강사의 커리큘럼입니다. (편집하려면 상단에서 본인 이름을 선택)</div>`;
  const rows = c.weeks.map((w, i) => `
    <tr><td class="wk-cell">${i+1}주</td>
      ${FIELDS.map(f => `<td class="field-td" data-label="${f.label}">
        <textarea class="cell-in" data-wk="${i}" data-key="${f.key}" placeholder="${f.ph}" ${editable?'':'readonly'} oninput="onEdit()">${esc(w[f.key])}</textarea></td>`).join('')}
    </tr>`).join('');
  $('stage').innerHTML = `<div class="editor">
    <div class="editor-head"><span class="ctitle">${esc(c.course)}</span><span class="cmeta">· 8주 과정</span><div class="spacer"></div>
      ${editable ? `<button class="mini-btn" onclick="renameCourse()">✎ 강좌명 수정</button><button class="mini-btn danger" onclick="deleteCourse()">🗑 삭제</button>` : ''}</div>
    ${roBanner}
    <table class="grid"><colgroup><col class="c-wk"><col class="c-topic"><col class="c-goal"><col class="c-act"><col class="c-task"></colgroup>
      <thead><tr><th>주차</th>${FIELDS.map(f=>`<th>${f.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table>
    ${editable ? `<div class="savebar"><button class="btn-save" id="saveBtn" onclick="saveCourse()">저장</button><span class="save-status" id="saveStatus">변경사항 없음</span></div>` : ''}
  </div>`;
  dirty = false;
}

function guardDirty() { if (dirty && !confirm('저장하지 않은 변경사항이 있습니다. 이동할까요?')) return false; return true; }
function switchInst(n) { if (!guardDirty()) return; activeInst = n; ensureActiveCourse(); renderAll(); }
function switchCourse(n) { if (!guardDirty()) return; activeCourse = n; renderAll(); }
function onEdit() {
  dirty = true;
  const s = $('saveStatus');
  if (s) { s.textContent = '저장 안 됨 — [저장]을 눌러주세요'; s.className = 'save-status dirty'; }
}
function collectWeeks() {
  const weeks = blankWeeks();
  document.querySelectorAll('.cell-in').forEach(el => { weeks[+el.dataset.wk][el.dataset.key] = el.value.trim(); });
  return weeks;
}
function newCourse() {
  if (!guardDirty()) return;
  const name = (prompt('새 강좌 이름을 입력하세요 (예: 글쓰기, 인문독서, 에세이)') || '').trim();
  if (!name) return;
  if ((data[activeInst] || []).some(c => c.course === name)) { toast('같은 이름의 강좌가 이미 있어요'); return; }
  data[activeInst].push({ course: name, weeks: blankWeeks() });
  activeCourse = name; renderAll(); toast('새 강좌 개설 — 내용 입력 후 저장하세요');
}
function renameCourse() {
  const c = courseObj(); if (!c) return;
  const name = (prompt('강좌명 수정', c.course) || '').trim();
  if (!name || name === c.course) return;
  if ((data[activeInst] || []).some(x => x.course === name)) { toast('같은 이름의 강좌가 이미 있어요'); return; }
  post({ sheet: SHEET, action: 'saveCourse', instructor: activeInst, course: c.course, newCourse: name, weeks: collectWeeks() });
  c.course = name; activeCourse = name; renderAll(); toast('강좌명 변경됨');
}
function deleteCourse() {
  const c = courseObj(); if (!c) return;
  if (!confirm(`'${c.course}' 강좌를 삭제할까요? 8주 내용이 모두 지워집니다.`)) return;
  post({ sheet: SHEET, action: 'deleteCourse', instructor: activeInst, course: c.course });
  data[activeInst] = data[activeInst].filter(x => x.course !== c.course);
  activeCourse = null; ensureActiveCourse(); renderAll(); toast('강좌 삭제됨');
}
async function saveCourse() {
  const c = courseObj(); if (!c) return;
  const weeks = collectWeeks(); c.weeks = weeks;
  const btn = $('saveBtn'), st = $('saveStatus');
  if (btn) btn.disabled = true;
  if (st) { st.textContent = '저장 중…'; st.className = 'save-status'; }
  try {
    await post({ sheet: SHEET, action: 'saveCourse', instructor: activeInst, course: c.course, newCourse: c.course, weeks });
    dirty = false;
    if (st) { st.textContent = '✓ 저장됨'; st.className = 'save-status ok'; }
    toast('저장 완료');
  } catch (e) {
    console.error(e);
    if (st) { st.textContent = '저장 실패 — 다시 시도'; st.className = 'save-status dirty'; }
    toast('저장 실패');
  } finally { if (btn) btn.disabled = false; }
}

// GAS로 POST (text/plain + no-cors → 프리플라이트·리다이렉트 이슈 회피, 서버에 확실히 기록)
async function post(payload) {
  await fetch(API, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
}

function setMe(v) {
  me = v; localStorage.setItem('penta_curri_me', v);
  if (INSTRUCTORS.some(i => i.name === v)) { activeInst = v; ensureActiveCourse(); }
  renderAll();
}
function openWhoModal() {
  $('whoBtns').innerHTML = IDENTITIES.map(n => {
    const ins = INSTRUCTORS.find(i => i.name === n);
    const desc = ins ? `${ins.role} 강사` : '센터장 · 전체 편집';
    return `<button class="who-btn" onclick="pickWho('${n}')">${n}<small>${desc}</small></button>`;
  }).join('');
  $('whoModal').classList.add('show');
}
function pickWho(n) { setMe(n); $('whoModal').classList.remove('show'); }

let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  if (!me) openWhoModal(); else if (INSTRUCTORS.some(i => i.name === me)) activeInst = me;
  await load();
})();
